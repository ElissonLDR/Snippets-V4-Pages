<section id="secao-cep-netwave">

    <div class="layout-grid">
  
      <div class="left-col">
        <h2 class="titulo-cep">
    Digite seu CEP abaixo e saiba na hora se a <span class="destaque">ultravelocidade da Netwave</span> já chegou na sua rua
    em <span class="destaque-soft">Itanhaém</span> ou <span class="destaque-soft">Mongaguá</span>.
  </h2>
  
        <div class="cep-wrapper">
          <div class="cep-input-box">
            <input type="text" id="cepInput" placeholder="Digite seu CEP" maxlength="9">
            <button id="btnVerificar" disabled>Verificar</button>
          </div>
        </div>
      </div>
  
      <div id="resultado">
        <div class="result-card card-placeholder" id="cardBase">
          <p class="placeholder-text">
            Digite o CEP ao lado para ver a disponibilidade
          </p>
        </div>
      </div>
  
    </div>
  
    <!-- MODAL -->
    <div id="modalCeps" class="modal-overlay">
        <div class="modal-box">
          <button id="fecharModal" class="modal-close">×</button>
          <h3>CEPs com cobertura ativa</h3>
          <div class="modal-list" id="listaCeps"></div>
        </div>
      </div>
  
  </section>
  
  <style>
    /* ELEMENTO HTML */
    #e_3444390_1_177222447019615932 .e_html { border-radius: 20px; overflow: hidden; }

    /* SEÇÃO */
    #secao-cep-netwave { width:100%; height:100%; padding:0; border-radius:20px; }

    /* LAYOUT */
    .layout-grid { display:flex; gap:30px; align-items:center; background:linear-gradient(135deg,rgba(139,66,240,1) 0%,rgba(243,113,32,1) 100%); border:1px solid rgba(255,255,255,0.16); padding:50px; border-radius:28px; box-shadow:0 25px 70px rgba(0,0,0,0.12); }

    /* PLACEHOLDER */
    .card-placeholder { opacity:.6; display:flex; align-items:center; justify-content:center; min-height:260px; }
    .placeholder-text { font-size:16px; color:#6b7280; }

    /* COLUNA ESQUERDA */
    .left-col { display:flex; flex-direction:column; align-items:flex-start; width:70%; }

    /* TÍTULO */
    .titulo-cep { font-family:'Unbounded',sans-serif; font-size:20px !important; margin-bottom:30px !important; line-height:1.5; text-align:left; color:rgba(255,255,255,0.95); text-shadow:0 6px 18px rgba(0,0,0,0.22); }

    /* DESTAQUE PRINCIPAL */
    .titulo-cep .destaque { background:linear-gradient(90deg,#ffffff,#ffe6d5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:800; }

    /* DESTAQUE SOFT */
    .titulo-cep .destaque-soft { color:rgba(255,255,255,0.92); font-weight:800; text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:2px; text-decoration-color:rgba(255,255,255,0.35); }

    /* WRAPPER CEP */
    .cep-wrapper { width:100%; max-width:520px; }

    /* INPUT BOX */
    .cep-input-box { display:flex; width:100%; border-radius:60px; border:1px solid rgba(255,255,255,0.22); overflow:hidden; transition:.3s; background:rgba(255,255,255,0.92); box-shadow:0 18px 45px rgba(0,0,0,0.12); }
    .cep-input-box:focus-within { border-color:rgba(255,255,255,0.55); box-shadow:0 0 0 4px rgba(255,255,255,0.18),0 18px 45px rgba(0,0,0,0.14); }

    /* INPUT */
    #cepInput { flex:1; padding:18px 24px; font-family:'Questrial',sans-serif; font-size:17px; border:none; outline:none; background:transparent; color:#111827; }
    #cepInput::placeholder { color:#9ca3af; }

    /* BOTÃO PRINCIPAL */
    #btnVerificar { padding:18px 32px; font-family:'Questrial',sans-serif; font-size:15px; font-weight:800; border:none; cursor:pointer; transition:.3s; background:linear-gradient(90deg,#8B42F0,#F37120); color:#fff; }
    #btnVerificar:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 14px 28px rgba(0,0,0,0.18); }
    #btnVerificar:disabled { background:#e5e7eb; color:#9ca3af; cursor:not-allowed; }

    /* RESULTADO */
    #resultado { min-height:260px; display:flex; align-items:center; justify-content:center; }

    /* CARD BASE */
    .result-card { width:380px; min-height: 350px; padding:40px; border-radius:22px; text-align:center; font-family:'Questrial',sans-serif; background:#fff; border:1px solid rgba(17,24,39,0.08); box-shadow:0 30px 80px rgba(0,0,0,0.14); }
    .result-icon { width:60px; height:60px; margin:0 auto 20px auto; }
    .result-card h3 { font-family:'Unbounded',sans-serif; font-size:22px; margin-bottom:15px; color:#111827; }
    .result-card p { font-size:16px; margin-bottom:25px; color:#4b5563; }

    /* CARD SUCESSO */
    .card-success { border: 2px solid rgb(34 197 94); box-shadow: 0px 0px 10px rgb(0 255 8 / 71%); }
    .card-success h3 { color:#16a34a; }
    .card-success svg { stroke:#16a34a; }
    .card-success button { padding:14px 30px; border-radius:40px; border:none; font-size:15px; font-weight:800; background:linear-gradient(90deg,#8B42F0,#F37120); color:#fff; cursor:pointer; transition:.3s; }
    .card-success button:hover { transform:translateY(-2px); box-shadow:0 12px 25px rgba(0,0,0,0.14); }

    /* CARD ERRO */
    .card-error { border:1px solid rgba(243,113,32,0.45); }
    .card-error h3 { color:#F37120; }
    .card-error svg { stroke:#F37120; }

    /* BOTÃO LISTA */
    .btn-lista { padding:12px 26px; border-radius:40px; border:2px solid #F37120; background:transparent; font-size:14px; font-weight:800; color:#F37120; cursor:pointer; transition:.3s; }
    .btn-lista:hover { background:#F37120; color:#fff; box-shadow:0 10px 25px rgba(243,113,32,0.20); transform:translateY(-1px); }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition:.3s; z-index:9999; }
    .modal-overlay.active { opacity:1; pointer-events:auto; }
    .modal-box { position:relative; background:#fff; width:90%; max-width:650px; border-radius:20px; padding:40px; text-align:left; font-family:'Questrial',sans-serif; max-height:420px; display:flex; flex-direction:column; box-shadow:0 30px 90px rgba(0,0,0,0.18); border:1px solid #f1f1f1; }
    .modal-box h3 { font-family:'Unbounded',sans-serif; font-size:20px; margin-bottom:20px; color:#6d28d9; }
    .modal-list { overflow:auto; font-size:14px; line-height:1.6; color:#4b5563; border-top:1px solid #eee; padding-top:20px; }
    
    /* BOTÃO FECHAR MODAL */
    .modal-close { position:absolute; top:15px; right:18px; background:transparent; border:none; font-size:24px; font-weight:700; cursor:pointer; color:#6b7280; transition:.2s; }
    .modal-close:hover { color:#111827; }

    /* RESPONSIVO */
    @media(max-width:600px) {
        #secao-cep-netwave { padding:0; }
        .layout-grid { flex-direction:column; padding:30px 20px; border-radius:22px; }
        .left-col { width:100%; }
        .titulo-cep { font-size:16px !important; }
        .cep-input-box { flex-direction:column; border-radius:18px; }
        #btnVerificar { width:100%; }
        .result-card { padding:20px !important; width: 100% !important; }
    }
  </style>

    function init(){
  
    var input = document.getElementById("cepInput");
    var btn = document.getElementById("btnVerificar");
    var resultado = document.getElementById("resultado");
    var modal = document.getElementById("modalCeps");
    var lista = document.getElementById("listaCeps");
  
    if(!input || !btn || !resultado) return;
  
    // ===== INPUT MASK =====
    input.oninput = function(){
  
      var d = onlyDigits(input.value);
      if(d.length > 8) d = d.substring(0,8);
  
      input.value = formatCEP(d);
      btn.disabled = d.length !== 8;
  
    };
  
    // ===== BOTÃO PRINCIPAL =====
    btn.onclick = function(){
  
      var cep = onlyDigits(input.value);
      if(cep.length !== 8) return;
  
      // SUCESSO
      if(ceps[cep]){
  
        var card = document.getElementById("cardBase");
        card.className = "result-card card-success";
        card.innerHTML =
        '<div class="result-icon">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2">'+
        '<path d="M5 12.55a11 11 0 0 1 14.08 0"/>'+
        '<path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>'+
        '<path d="M12 20h.01"/>'+
        '</svg>'+
        '</div>'+
        '<h3>Internet disponível no CEP '+formatCEP(cep)+'</h3>'+
        '<p>Ótima notícia! Temos cobertura de fibra óptica de alta velocidade na sua região.</p>'+
        '<button id="btnContato">Falar com Atendimento</button>';
  
      } 
      // ERRO
      else {
  
        var card = document.getElementById("cardBase");
        card.className = "result-card card-error";
        card.innerHTML =
        '<div class="result-icon">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2">'+
        '<circle cx="12" cy="12" r="10"/>'+
        '<line x1="15" y1="9" x2="9" y2="15"/>'+
        '<line x1="9" y1="9" x2="15" y2="15"/>'+
        '</svg>'+
        '</div>'+
        '<h3>Sem cobertura no momento</h3>'+
        '<p>O CEP '+formatCEP(cep)+' ainda está fora da nossa área.</p>'+
        '<button class="btn-lista" id="abrirLista">Ver CEPs atendidos</button>';
      }
  
    };
  
    // ===== DELEGAÇÃO DE EVENTOS (MODAL + WHATSAPP) =====
    document.onclick = function(e){
  
      // WhatsApp
      if(e.target && e.target.id === "btnContato"){
        var cep = onlyDigits(input.value);
        window.open(
    "https://wa.me/5513978114161?text=Olá, quero contratar para o CEP "+cep,
    "_blank"
  );
      }
  
      // Abrir lista
      if(e.target && e.target.id === "abrirLista"){
        if(lista && modal){
          lista.innerHTML = Object.keys(ceps).join("<br>");
          modal.classList.add("active");
        }
      }
        // Fechar pelo botão X
        if(e.target && e.target.id === "fecharModal"){
        modal.classList.remove("active");
        }
      // Fechar modal clicando fora
      if(e.target === modal){
        modal.classList.remove("active");
      }
  
    };
  
  }
  
  document.addEventListener("DOMContentLoaded", init);
  
  })();

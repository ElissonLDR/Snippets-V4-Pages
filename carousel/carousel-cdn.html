<style>
  .swiper { width: 100%; padding: 10px 0; position: relative; }

  .swiper-slide img { width: 100%; height: auto; display: block; border-radius: 25px; user-select: none; transition: transform 0.3s ease, filter 0.3s ease; }
  .swiper-button-next, .swiper-button-prev { background: rgba(58, 27, 4, 0.7); padding: 8px; border-radius: 50%; color: white; margin-top: auto; top: 50%; transform: translateY(-50%); width: 25px; height: 25px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .swiper-button-next:after, .swiper-button-prev:after { font-size: 10px; font-weight: 800; }
  .swiper-button-next:hover, .swiper-button-prev:hover { background: #000; }

  /* Responsividade */
  @media (max-width: 980px) {
    .swiper-button-next, .swiper-button-prev { width: 30px; height: 30px; }
  }

  @media (max-width: 600px) {
    .swiper-button-next, .swiper-button-prev { width: 25px; height: 25px; }
  }
</style>

<script>
  function initializeSwiper() {
  new Swiper(".swiper", {
    loop: true,
    slidesPerView: 6,
    spaceBetween: 10,
    autoplay: {
      delay: 500,
      disableOnInteraction: true,
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
    breakpoints: {
      0: { slidesPerView: 2 },
      600: { slidesPerView: 3 },
      980: { slidesPerView: 6 },
    },
  });
}
</script>
